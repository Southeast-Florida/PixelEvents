<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мероприятие создано</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #c850c0, #4158d0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(to right, #ff00cc, #3333ff);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      padding: 1.25rem;
    }

    .card-body {
      padding: 2rem;
      text-align: center;
    }

    .checkmark {
      font-size: 3rem;
      color: #3ac166;
      margin-bottom: 1rem;
    }

    h1 {
      color: #333;
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    table th, table td {
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 0.95rem;
    }

    table th {
      background-color: #f4f4f4;
      width: 40%;
    }

    .card-footer {
      margin-top: 1rem;
    }

    .card-footer a {
      display: inline-block;
      background: linear-gradient(to right, #c850c0, #4158d0);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .card-footer a:hover {
      background: linear-gradient(to right, #a03aa0, #3248c0);
    }

    @media (max-width: 480px) {
      .card-body {
        padding: 1.5rem;
      }

      table th, table td {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      pixel events — МЕРОПРИЯТИЕ СОЗДАНО
    </div>
    <div class="card-body">
      <div class="checkmark">✔</div>
      <h1>Мероприятие успешно создано</h1>
      <table>
        <tr>
          <th>Название</th>
          <td>{{ event.title }}</td>
        </tr>
        <tr>
          <th>Тип</th>
          <td>{{ event.event_type }}</td>
        </tr>
        <tr>
          <th>Дата и время</th>
          <td>{{ event.datetime|date:"d.m.Y H:i" }}</td>
        </tr>
        <tr>
          <th>Место проведения</th>
          <td>{{ event.location }}</td>
        </tr>
        <tr>
          <th>Макс. участников</th>
          <td>{{ event.max_participants }}</td>
        </tr>
      </table>
      <div class="card-footer">
        <a href="{% url 'create_event' %}">Создать ещё одно мероприятие</a>
      </div>
    </div>
  </div>
</body>
</html>
