{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Главная участника</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #c850c0, #4158d0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #4b006e;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      flex: 1;
    }

    .info-card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .info-card h1 {
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: linear-gradient(to right, #ff00cc, #3333ff);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .info-card p {
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-card {
        padding: 30px 20px;
      }

      .info-card p {
        font-size: 15px;
      }
    }
  </style>
  <script src="https://kit.fontawesome.com/a2d9d6f409.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="logo">🎟️ pixel events</div>
  <nav>
    <a href="#"><i class="fas fa-search"></i> Найти мероприятие</a>
    <a href="#"><i class="fas fa-calendar-alt"></i> Календарь</a>
    <a href="#"><i class="fas fa-bolt"></i> Предстоящие</a>
    <a href="#"><i class="fas fa-user-circle"></i> Личный кабинет</a>
  </nav>
</header>

<main>
  <div class="info-card">
    <h1>Добро пожаловать, {{ user.name }}!</h1>
    <p>Вы успешно вошли как участник.</p>
    <p>Здесь скоро появится список событий, на которые вы зарегистрированы.</p>
  </div>
</main>

</body>
</html>
